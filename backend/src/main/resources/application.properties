

spring.application.name=StockTrackApp
server.port=${SERVER_PORT:8082}

alphavantage.stock.api.key=${ALPHAVANTAGE_STOCK_API_KEY}
alphavantage.news.api.key=${ALPHAVANTAGE_NEWS_API_KEY}

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:mydatabase}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
