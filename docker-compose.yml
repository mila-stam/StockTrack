version: "3.8"

services:
  db:
    image: postgres:16
    container_name: stocktrack-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - stocktrack-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocktrack-backend
    depends_on:
      - db:
          condition: service_healthy
    env_file:
      - .env
    ports:
      - "8082:8082"
    networks:
      - stocktrack-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocktrack-frontend
    depends_on:
      - backend
    environment:
      # Browser calls backend via localhost:8082 (host machine port)
      REACT_APP_API_URL: http://localhost:8082
    ports:
      - "3000:3000"
    networks:
      - stocktrack-net
    restart: unless-stopped

networks:
  stocktrack-net:
    driver: bridge

volumes:
  db_data:
